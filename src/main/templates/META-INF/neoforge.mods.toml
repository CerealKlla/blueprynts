license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

description='''
Construction and blueprint authoring mod: the Construction Site mechanic lets a player
design a free-form footprint with Footprint Slabs, build within a protected volume, and
save/load the result as a reusable Blueprint.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- Blueprint Types are bridged into Settlemynts' Zone Type registry only
# if Settlemynts happens to be loaded (see bridge.SettlemyntsZoneBridge); the mod works standalone
# without it. No versionRange -- an empty string is an invalid range that makes FML reject an
# installed Settlemynts outright (same gotcha Lyfe's own optional Cartographyr dependency hit),
# omitting the field entirely is what actually means "any version."
[[dependencies.${mod_id}]]
    modId="settlemynts"
    type="optional"
    reason="Registers Blueprynts' built-in Blueprint Types as Settlemynts Zone Types if present."
    ordering="AFTER"
    side="BOTH"

# Optional soft dependency -- a Construction Site's refund pile deposits into Yconomics' own Loot
# Bag entity if present (see bridge.YconomicsLootBridge); it falls back to a plain scattered
# ItemEntity without it. Same no-versionRange reasoning as the Settlemynts entry above.
[[dependencies.${mod_id}]]
    modId="yconomics"
    type="optional"
    reason="Deposits a Construction Site's refund pile into a Yconomics Loot Bag if present."
    ordering="AFTER"
    side="BOTH"

# Optional soft dependency, added 2026-10-02 -- contributes this mod's own Construction Site debug
# item into Kyt's mod-managed "Dev" Kyt if Kyt is present; the mod works standalone without it.
[[dependencies.${mod_id}]]
    modId="kyt"
    type="optional"
    reason="Contributes Blueprynts' Construction Site debug item into Kyt's mod-managed Dev Kyt."
    ordering="AFTER"
    side="BOTH"
